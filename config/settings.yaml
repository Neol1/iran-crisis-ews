project:
  name: "Iran Crisis EWS"
  version: "1.0.0"
  timezone: "Asia/Tehran"

geography:
  iran_bbox:
    min_lat: 25
    max_lat: 40
    min_lon: 44
    max_lon: 63
  cities:
    Tehran: [35.6892, 51.3890]
    Mashhad: [36.2605, 59.6168]
    Isfahan: [32.6546, 51.6680]
    Shiraz: [29.5918, 52.5837]
    Tabriz: [38.0800, 46.2919]
    Ahvaz: [31.3183, 48.6706]
    Qom: [34.6416, 50.8746]
    Kermanshah: [34.3142, 47.0650]
    Urmia: [37.5527, 45.0761]
    Rasht: [37.2808, 49.5832]

time_range:
  start: "2020-01-01"
  end: "today"

paths:
  artifacts: "/kaggle/working/artifacts"
  raw: "{artifacts}/raw"
  processed: "{artifacts}/processed"
  graph: "{artifacts}/graph"
  models: "{artifacts}/models"
  forecasts: "{artifacts}/forecasts"
  viz: "{artifacts}/viz"
  reports: "{artifacts}/reports"
  logs: "{artifacts}/logs"
  checkpoints: "{artifacts}/checkpoints"

models:
  llm: "microsoft/Phi-3-mini-4k-instruct"
  sentiment_fa: "HooshvareLab/bert-fa-base-uncased-sentiment-digikala"
  ner_fa: "HooshvareLab/bert-fa-base-uncased-ner-arman"
  sentiment_en: "cardiffnlp/twitter-roberta-base-sentiment-latest"
  embeddings: "paraphrase-multilingual-MiniLM-L12-v2"

thresholds:
  crisis_low: 0.3
  crisis_medium: 0.6
  crisis_high: 0.8
  graph_spatial_km: 100
  graph_temporal_days: 7

rate_limits:
  gdelt: 1
  acled: 1
  usgs: 5
  weather: 5
  worldbank: 5
  firms: 1
  who: 5
